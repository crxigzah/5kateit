name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extension unit tests
        run: node --test extension/test/*.test.js
      - name: Extension and app versions match
        run: |
          app=$(python -c "import tcf; print(tcf.__version__)")
          ext=$(python -c "import json; print(json.load(open('extension/manifest.json'))['version'])")
          test "$app" = "$ext" || { echo "tcf/__init__.py is $app but extension/manifest.json is $ext"; exit 1; }
      - run: python -m pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { (Select-String -Path tcf/__init__.py -Pattern '"([^"]+)"').Matches[0].Groups[1].Value }
          "APP_VERSION=$v" >> $env:GITHUB_ENV
          "__version__ = `"$v`"" | Set-Content tcf/__init__.py
      - run: pyinstaller --noconfirm snackhack.spec
      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path dist/Snackhack/* -DestinationPath Snackhack-portable.zip
      - name: Zip extension
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ext-out | Out-Null
          Copy-Item -Recurse extension/* ext-out/ -Exclude test
          Remove-Item -Recurse -Force ext-out/test -ErrorAction SilentlyContinue
          Compress-Archive -Path ext-out/* -DestinationPath Snackhack-extension.zip
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Snackhack-windows
          path: |
            installer-out/Snackhack-Setup.exe
            Snackhack-portable.zip
            Snackhack-extension.zip
      # A push to main publishes (or updates) the release for the version in tcf/__init__.py.
      # Bump that version to cut a new release.
      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Snackhack ${{ env.APP_VERSION }}
          make_latest: true
          files: |
            Snackhack-extension.zip
            installer-out/Snackhack-Setup.exe
            Snackhack-portable.zip

  site:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Point download links at this repo
        run: sed -i "s#__REPO__#${{ github.repository }}#g" site/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

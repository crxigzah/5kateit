name: Delete a release

# Run manually from the Actions tab: deletes the release and its git tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to delete (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - run: gh release delete "${{ inputs.tag }}" --repo "${{ github.repository }}" --cleanup-tag --yes
        env:
          GH_TOKEN: ${{ github.token }}
